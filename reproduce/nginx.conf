# Loopback reverse proxy for the two GLM-5.3-Flash TP4/EP4 replicas.
# Put an authenticated, TLS-terminating ingress in front of this listener.
# Keep bearer keys outside this repository; do not expose this listener directly.

map $http_x_claude_code_session_id $sticky_key {
    ""      $request_id;
    default $http_x_claude_code_session_id;
}

upstream glm53f {
    hash $sticky_key consistent;
    server 127.0.0.1:30000;
    server 127.0.0.1:30100;
    keepalive 32;
}

server {
    listen 127.0.0.1:8080;
    client_max_body_size 32m;
    client_body_buffer_size 8m;

    location = /v1/chat/completions { proxy_pass http://glm53f; include /etc/nginx/proxy-common.conf; }
    location = /v1/completions      { proxy_pass http://glm53f; include /etc/nginx/proxy-common.conf; }
    location = /v1/models           { proxy_pass http://glm53f; include /etc/nginx/proxy-common.conf; }
    location = /v1/messages         { proxy_pass http://glm53f; include /etc/nginx/proxy-common.conf; }
    location = /v1/messages/count_tokens { proxy_pass http://glm53f; include /etc/nginx/proxy-common.conf; }
    location = /v1/responses            { proxy_pass http://glm53f; include /etc/nginx/proxy-common.conf; }
    location = /ping                { proxy_pass http://glm53f; include /etc/nginx/proxy-common.conf; }
    location / { return 404; }
}
